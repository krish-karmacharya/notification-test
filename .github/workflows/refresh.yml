name: Refresh data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull sources
        run: node scripts/fetch.mjs
      - name: Draft notification text
        run: node scripts/draft.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%FT%TZ)"
          git push
